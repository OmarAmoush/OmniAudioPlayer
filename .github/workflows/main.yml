name: Build Signed Android APK (.NET MAUI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip Automatically
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.zip | ForEach-Object {
            Write-Host "Extracting $_.FullName..."
            Expand-Archive -Path $_.FullName -DestinationPath . -Force
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android --include-previews

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Generate Signing Keystore
        shell: pwsh
        run: |
          if (-not (Test-Path "omniaudio-release.keystore")) {
            keytool -genkeypair -v `
              -keystore omniaudio-release.keystore `
              -alias omniaudio `
              -keyalg RSA `
              -keysize 2048 `
              -validity 10000 `
              -storepass OmniAudio123! `
              -keypass OmniAudio123! `
              -dname "CN=OmniAudioPlayer, OU=Mobile, O=OmniAudio, L=Cairo, S=EG, C=EG"
          }

      - name: Publish Signed Release APK
        run: |
          dotnet publish OmniAudioPlayer/OmniAudioPlayer.csproj -f net8.0-android -c Release -p:CheckEolWorkloads=false -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="omniaudio-release.keystore" -p:AndroidSigningKeyAlias=omniaudio -p:AndroidSigningKeyPass=OmniAudio123! -p:AndroidSigningStorePass=OmniAudio123! -o ./published-apk

      - name: Upload Ready-to-Install Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniAudioPlayer-Signed-APK
          path: published-apk/*-Signed.apk
